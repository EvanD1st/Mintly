name: Mintly CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests and production smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Start disposable PostgreSQL with official mirror fallback
        run: |
          set -euo pipefail
          pulled=false
          for image in postgres:16-alpine mirror.gcr.io/library/postgres:16-alpine public.ecr.aws/docker/library/postgres:16-alpine; do
            if docker pull "$image"; then docker tag "$image" postgres:16-alpine; pulled=true; break; fi
          done
          test "$pulled" = true
          docker run -d --name mintly-postgres-tests -p 127.0.0.1:15432:5432 \
            -e POSTGRES_USER=mintly_test -e POSTGRES_PASSWORD=disposable-ci-only -e POSTGRES_DB=mintly_test \
            --health-cmd 'pg_isready -U mintly_test -d mintly_test' --health-interval 5s \
            --health-timeout 5s --health-retries 12 postgres:16-alpine
          for attempt in $(seq 1 60); do
            if docker exec mintly-postgres-tests pg_isready -U mintly_test -d mintly_test; then exit 0; fi
            sleep 1
          done
          exit 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Start isolated EVM for real permission-contract tests
        working-directory: backend/tests/evm
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/hardhat/dist/src/cli.js node --hostname 127.0.0.1 --port 18545 > "$RUNNER_TEMP/mintly-evm.log" 2>&1 &
          MINTLY_EVM_CHAIN_ID=999 node node_modules/hardhat/dist/src/cli.js --network hardhat node --hostname 127.0.0.1 --port 18546 > "$RUNNER_TEMP/mintly-hype-evm.log" 2>&1 &
          MINTLY_EVM_CHAIN_ID=33139 node node_modules/hardhat/dist/src/cli.js --network hardhat node --hostname 127.0.0.1 --port 18547 > "$RUNNER_TEMP/mintly-ape-evm.log" 2>&1 &
          MINTLY_EVM_CHAIN_ID=57073 node node_modules/hardhat/dist/src/cli.js --network hardhat node --hostname 127.0.0.1 --port 18548 > "$RUNNER_TEMP/mintly-ink-evm.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' http://127.0.0.1:18545 >/dev/null; then break; fi
            sleep 1
          done
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests -p tests.latency_trace -v --durations=30
        env:
          ALLOW_LIVE_BROADCAST: "false"
          SIGNER_MODE: demo
          MINTLY_LATENCY_REPORT: ../audit/sqlite-feature-latency.json
          MINTLY_LATENCY_LABEL: GitHub Ubuntu Python3.12 SQLite local SeaDrop
          MINTLY_TEST_RPC: http://127.0.0.1:18545
          MINTLY_TEST_RPC_999: http://127.0.0.1:18546
          MINTLY_TEST_RPC_33139: http://127.0.0.1:18547
          MINTLY_TEST_RPC_57073: http://127.0.0.1:18548
      - name: Check wallet capability probe and PostgreSQL execution locking
        working-directory: backend
        run: |
          node --test tests/wallet-capabilities.browser.cjs
          python -m pytest tests -p tests.latency_trace -v --durations=30
        env:
          MINTLY_TEST_RPC: http://127.0.0.1:18545
          MINTLY_TEST_DATABASE_URL: postgresql+asyncpg://mintly_test:disposable-ci-only@127.0.0.1:15432/mintly_test
          MINTLY_LATENCY_REPORT: ../audit/postgres-feature-latency.json
          MINTLY_LATENCY_LABEL: GitHub Ubuntu Python3.12 PostgreSQL16 local SeaDrop
          MINTLY_TEST_RPC_999: http://127.0.0.1:18546
          MINTLY_TEST_RPC_33139: http://127.0.0.1:18547
          MINTLY_TEST_RPC_57073: http://127.0.0.1:18548
      - name: Check shell syntax and clean production startup
        run: |
          # Official-image mirror avoids Docker Hub's shared-runner pull quota.
          pulled=false
          for image in public.ecr.aws/docker/library/python:3.12-slim mirror.gcr.io/library/python:3.12-slim python:3.12-slim; do
            if docker pull "$image"; then docker tag "$image" python:3.12-slim; pulled=true; break; fi
          done
          test "$pulled" = true
          for script in deploy/*.sh; do bash -n "$script"; done
          APP_DIR="$RUNNER_TEMP/mintly" bash deploy/deploy-ubuntu.sh
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8095/api/wallets)" = 401
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-latency-report
          path: audit/*.json
      - name: Container logs on failure
        if: failure()
        run: |
          MINTLY_ENV_FILE="$RUNNER_TEMP/mintly/shared/.env" docker compose --env-file "$RUNNER_TEMP/mintly/shared/.env" -f backend/docker-compose.yml logs --tail 80

  mobile-tests:
    name: Mobile Flutter Suite
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
        if: success() || failure()
        env:
          MINTLY_WIDGET_LATENCY_REPORT: ../audit/mobile-widget-latency.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-widget-latency-report
          path: audit/mobile-widget-latency.jsonl
      - name: Save rendered dark screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dark-screen-previews
          path: mobile/build/dark-redesign/*.png
          if-no-files-found: ignore
          retention-days: 14

  secure-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: |
          sudo chmod 666 /dev/kvm
          cd mobile
          flutter pub get
          flutter build apk --debug
          cd android
          ./gradlew app:assembleDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r mobile/build/app/outputs/flutter-apk/app-debug.apk
            adb install -r mobile/build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e phase save com.mintly.mintly.test/com.mintly.mintly.test.SecureSessionInstrumentation | tee session-save.txt
            grep -q 'Session saved for restart test.' session-save.txt
            adb shell am force-stop com.mintly.mintly
            adb shell am instrument -w -e phase verify com.mintly.mintly.test/com.mintly.mintly.test.SecureSessionInstrumentation | tee session-tests.txt
            grep -q 'Secure session: round-trip, encrypted disk, restart, tamper, clear passed.' session-tests.txt
            adb shell locksettings set-pin 739182
            adb shell am instrument -w -e phase protected-save com.mintly.mintly.test/com.mintly.mintly.test.SecureSessionInstrumentation | tee protected-save.txt
            grep -q 'Protected accounts saved for process restart; Keystore authentication and origin binding verified.' protected-save.txt
            adb shell am force-stop com.mintly.mintly
            adb shell am instrument -w -e phase protected-verify com.mintly.mintly.test/com.mintly.mintly.test.SecureSessionInstrumentation | tee protected-tests.txt
            grep -q 'Protected accounts: PIN unlock, cancelled unlock, encrypted storage, origin binding, process restart, remove and tamper recovery passed.' protected-tests.txt

  deploy-ubuntu:
    name: Deploy verified revision to Ubuntu
    needs: [backend-tests, mobile-tests, secure-session]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: mintly-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Upload and deploy tested revision
        env:
          SSH_KEY: ${{ secrets.UBUNTU_SSH_KEY }}
          SSH_HOST: ${{ secrets.UBUNTU_HOST }}
          SSH_USER: ${{ secrets.UBUNTU_USER }}
          KNOWN_HOSTS: ${{ secrets.UBUNTU_KNOWN_HOSTS }}
          PUBLIC_URL: ${{ vars.MINTLY_PUBLIC_URL }}
        run: |
          set -euo pipefail
          : "${SSH_KEY:?Missing UBUNTU_SSH_KEY}"
          : "${SSH_HOST:?Missing UBUNTU_HOST}"
          : "${SSH_USER:?Missing UBUNTU_USER}"
          : "${KNOWN_HOSTS:?Missing UBUNTU_KNOWN_HOSTS}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/mintly-key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/mintly-key ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/mintly-key' EXIT
          SSH_OPTS=(-i ~/.ssh/mintly-key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=30)
          RELEASE="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git archive --format=tar.gz -o "$RUNNER_TEMP/mintly.tar.gz" HEAD
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" "mkdir -p ~/Mintly/releases/$RELEASE"
          scp "${SSH_OPTS[@]}" "$RUNNER_TEMP/mintly.tar.gz" "$SSH_USER@$SSH_HOST:Mintly/releases/$RELEASE/source.tar.gz"
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" "set -eu; cd ~/Mintly/releases/$RELEASE; tar -xzf source.tar.gz; MINTLY_RELEASE=$GITHUB_SHA bash deploy/deploy-ubuntu.sh"
          if [ -n "$PUBLIC_URL" ]; then
            curl --fail --silent --show-error --retry 5 --retry-delay 5 "$PUBLIC_URL/healthz"
          fi
