name: Mintly CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest test suite
        run: |
          python -m pytest tests -v
        env:
          ALLOW_LIVE_BROADCAST: "false"
          SIGNER_TYPE: "mock"

  mobile-tests:
    name: Mobile Flutter Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter analyzer
        run: flutter analyze

      - name: Run Flutter widget tests
        run: flutter test

  deploy-ubuntu:
    name: Deploy to Ubuntu Server
    needs: [ backend-tests, mobile-tests ]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Ubuntu Host via SSH
        env:
          SSH_KEY: ${{ secrets.UBUNTU_SSH_KEY || secrets.VESSEL_DEPLOY_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.UBUNTU_HOST || '18.175.211.11' }}
          SSH_USER: ${{ secrets.UBUNTU_USER || 'ubuntu' }}
          SSH_PORT: ${{ secrets.UBUNTU_SSH_PORT || '22' }}
          KNOWN_HOSTS: ${{ secrets.UBUNTU_KNOWN_HOSTS || secrets.VESSEL_DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::warning::No SSH key found in secrets (checked UBUNTU_SSH_KEY, VESSEL_DEPLOY_SSH_KEY, SSH_PRIVATE_KEY, SSH_KEY)."
            echo "To enable automated deployment, add your SSH private key in GitHub Repo Settings > Secrets and variables > Actions."
            exit 0
          fi

          mkdir -m 700 -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy-key
          chmod 600 ~/.ssh/deploy-key

          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            SSH_OPTS="-o StrictHostKeyChecking=yes -p $SSH_PORT"
          else
            SSH_OPTS="-o StrictHostKeyChecking=accept-new -p $SSH_PORT"
          fi

          echo "Connecting to $SSH_USER@$SSH_HOST:$SSH_PORT..."
          ssh -i ~/.ssh/deploy-key $SSH_OPTS "$SSH_USER@$SSH_HOST" "
            set -e
            echo '=== Deploying Mintly to Ubuntu Host ==='
            APP_DIR=\${UBUNTU_APP_DIR:-~/Mintly}
            if [ ! -d \"\$APP_DIR\" ]; then
              echo 'Cloning repository...'
              git clone https://github.com/EvanD1st/Mintly.git \"\$APP_DIR\"
              cd \"\$APP_DIR\"
            else
              echo 'Pulling latest code...'
              cd \"\$APP_DIR\"
              git fetch origin
              git checkout main || git checkout master
              git pull origin main || git pull origin master
            fi

            cd \"\$APP_DIR/backend\"
            if [ ! -f .env ]; then
              echo 'Creating .env from .env.example...'
              cp .env.example .env
            fi

            echo 'Starting Docker Compose stack (backend, worker, postgres, redis)...'
            docker compose down || true
            docker compose up --build -d

            echo '=== Mintly Deployment Successful! Running Services: ==='
            docker compose ps
          "
