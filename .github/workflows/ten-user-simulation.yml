name: Isolated ten-user simulation

on:
  push:
    branches: [codex/ten-user-simulation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    name: Simulation (${{ matrix.database }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Disposable local SeaDrop chain
        working-directory: backend/tests/evm
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/hardhat/dist/src/cli.js node --hostname 127.0.0.1 --port 18545 > "$RUNNER_TEMP/scale-evm.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' http://127.0.0.1:18545 >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Disposable PostgreSQL
        if: matrix.database == 'postgres'
        run: |
          set -euo pipefail
          pulled=false
          for image in postgres:16-alpine mirror.gcr.io/library/postgres:16-alpine public.ecr.aws/docker/library/postgres:16-alpine; do
            if docker pull "$image"; then docker tag "$image" postgres:16-alpine; pulled=true; break; fi
          done
          test "$pulled" = true
          docker run -d --name scale-postgres -p 127.0.0.1:15432:5432 -e POSTGRES_USER=mintly_test -e POSTGRES_PASSWORD=disposable-ci-only -e POSTGRES_DB=mintly_test_scale postgres:16-alpine
          for attempt in $(seq 1 60); do
            if docker exec scale-postgres pg_isready -U mintly_test -d mintly_test_scale; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Correctness, contention and fault scenarios
        working-directory: backend
        run: python -m pytest tests/test_ten_user_simulation.py tests/test_opensea_multiwallet.py tests/test_opensea_reliability.py -p tests.latency_trace -q --durations=15
        env:
          APP_ENV: development
          ALLOW_LIVE_BROADCAST: 'false'
          SIGNER_MODE: demo
          DATABASE_URL: sqlite+aiosqlite:///./scale-app-disposable.db
          MINTLY_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+asyncpg://mintly_test:disposable-ci-only@127.0.0.1:15432/mintly_test_scale' || 'sqlite+aiosqlite:///./scale-test-disposable.db' }}
          MINTLY_TEST_RPC: http://127.0.0.1:18545
          MINTLY_SCALE_REPORT: ../audit/scale-${{ matrix.database }}-fixture-kdf.jsonl
          MINTLY_LATENCY_REPORT: ../audit/scale-${{ matrix.database }}-http.json
      - name: Production KDF cost profile (controlled provider and local chain)
        working-directory: backend
        run: python -m pytest tests/test_ten_user_simulation.py -k 'mixed_accounts or cached_whitelist' -p tests.latency_trace -q --durations=10
        env:
          APP_ENV: development
          ALLOW_LIVE_BROADCAST: 'false'
          SIGNER_MODE: demo
          DATABASE_URL: sqlite+aiosqlite:///./scale-app-disposable.db
          MINTLY_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+asyncpg://mintly_test:disposable-ci-only@127.0.0.1:15432/mintly_test_scale' || 'sqlite+aiosqlite:///./scale-test-disposable.db' }}
          MINTLY_TEST_RPC: http://127.0.0.1:18545
          MINTLY_SCALE_PRODUCTION_KDF: '1'
          MINTLY_SCALE_REPORT: ../audit/scale-${{ matrix.database }}-production-kdf.jsonl
          MINTLY_LATENCY_REPORT: ../audit/scale-${{ matrix.database }}-production-kdf-http.json
      - name: Cold full daily list and fresh automatic mints with real request pacing
        working-directory: backend
        run: python -m pytest tests/test_full_daily_list_simulation.py -p tests.latency_trace -q -s --durations=5
        env:
          APP_ENV: development
          ALLOW_LIVE_BROADCAST: 'false'
          SIGNER_MODE: demo
          DATABASE_URL: sqlite+aiosqlite:///./scale-app-disposable.db
          MINTLY_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+asyncpg://mintly_test:disposable-ci-only@127.0.0.1:15432/mintly_test_scale' || 'sqlite+aiosqlite:///./scale-test-disposable.db' }}
          MINTLY_TEST_RPC: http://127.0.0.1:18545
          MINTLY_SCALE_PRODUCTION_KDF: '1'
          MINTLY_SCALE_REPORT: ../audit/scale-${{ matrix.database }}-full-list.jsonl
          MINTLY_LATENCY_REPORT: ../audit/scale-${{ matrix.database }}-full-list-http.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ten-user-${{ matrix.database }}
          path: |
            audit/scale-*.json
            audit/scale-*.jsonl
