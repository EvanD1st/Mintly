# Include only inside the existing HTTPS server block. Keep the normal API route.
# Never add request-body logging or APM payload capture to these locations.
location = /api/automatic/import {
    client_max_body_size 4k;
    client_body_buffer_size 8k;
    client_body_timeout 15s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    access_log off;
    proxy_read_timeout 100s;
    proxy_pass http://127.0.0.1:18768;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;
}
location = /api/automatic/import/config {
    proxy_cache off;
    proxy_pass http://127.0.0.1:18768;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;
}
