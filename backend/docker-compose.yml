name: mintly

x-app: &app
  image: mintly-backend:${MINTLY_RELEASE:-local}
  build:
    context: .
  restart: unless-stopped
  env_file:
    - ${MINTLY_ENV_FILE:-.env}
  environment:
    DATABASE_URL: postgresql+asyncpg://mintly:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/mintly
    APP_ENV: production
    DEBUG: "false"
    SIGNER_MODE: disabled
    ALLOW_LIVE_BROADCAST: "false"
    TIMEZONE: Africa/Lagos
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mintly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: mintly
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mintly -d mintly"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    <<: *app
    restart: "no"
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:${MINTLY_PORT:-8095}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  worker:
    <<: *app
    command: python -m app.worker
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
